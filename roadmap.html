<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نقشه راه ۳۰ فصلی گولنگ و سفارش‌های کارفرما</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f172a; --bg-secondary: #1e293b; --bg-card: #182234;
            --accent-cyan: #38bdf8; --accent-indigo: #818cf8; --accent-emerald: #34d399;
            --accent-amber: #fbbf24; --accent-rose: #f43f5e; --text-main: #f8fafc;
            --text-muted: #94a3b8; --border-color: #334155; --radius-md: 12px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); line-height: 1.8; padding: 24px; }
        .container { max-width: 1100px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 24px; padding: 20px; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius-md); }
        header h1 { font-size: 1.8rem; font-weight: 800; color: var(--accent-cyan); margin-bottom: 6px; }
        .progress-box { background-color: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 16px; margin-bottom: 24px; }
        .progress-bar-bg { background-color: #0b1120; height: 12px; border-radius: 10px; overflow: hidden; border: 1px solid var(--border-color); }
        .progress-bar-fill { background: linear-gradient(90deg, #38bdf8, #34d399); height: 100%; width: 0%; transition: width 0.3s ease; }
        .chapter-card { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 20px; margin-bottom: 16px; }
        .chapter-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 10px; margin-bottom: 12px; }
        .checkbox-label { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.1rem; cursor: pointer; }
        .custom-chk { width: 22px; height: 22px; cursor: pointer; }
        .grid-details { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; margin-top: 10px; font-size: 0.88rem; }
        .detail-item { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); padding: 10px; border-radius: 8px; }
        .detail-item strong { color: var(--accent-indigo); display: block; margin-bottom: 2px; }
        .brief-box { background: rgba(15,23,42,0.7); border-right: 4px solid var(--accent-cyan); padding: 12px; margin-top: 10px; border-radius: 0 8px 8px 0; font-size: 0.9rem; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>نقشه راه ۳۰ فصلی مهارت‌های Go و سفارش‌های کارفرما</h1>

    </header>

    <div class="progress-box">
        <div style="display:flex; justify-content:space-between; margin-bottom:6px; font-weight:600;">

            <span id="progress-text" style="color:var(--accent-cyan);">۰٪</span>
        </div>
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-fill"></div></div>
    </div>

    <div id="chapters-container"></div>
</div>

    { id: 23, title: "فصل ۲۳: پروژه خودرو — روتینگ و Validation در Gin", book: "اعتبارسنجی ورودی‌های وب", mistakes: "نیازی نیست", source: "gin-gonic/gin فایل binding/binding.go", brief: "پیاده‌سازی Custom Validator برای سال تولید و قیمت خودرو." },

    { id: 26, title: "فصل ۲۶: پروژه خودرو — احراز هویت، OTP و JWT", book: "امنیت نشست‌ها در وب", mistakes: "نیازی نیست", source: "نیازی نیست", brief: "سیستم لاگین پیامکی با محدودیت IP در Redis و صدور توکن JWT." },

function render() {
    const container = document.getElementById("chapters-container");
    const state = JSON.parse(localStorage.getItem("go_30_progress") || "{}");
    container.innerHTML = "";

    chapters.forEach(c => {
        const isChecked = !!state[c.id];
        container.innerHTML += `
            <div class="chapter-card">
                <div class="chapter-header">
                    <label class="checkbox-label">
                        <input type="checkbox" class="custom-chk" id="chk-${c.id}" ${isChecked ? 'checked' : ''} onchange="toggle(${c.id})">
                        <span>${c.title}</span>
                    </label>
                </div>
                <div class="grid-details">
                    <div class="detail-item"><strong>📘 کتاب Learning Go:</strong>${c.book}</div>
                    <div class="detail-item"><strong>📕 کتاب 100 Go Mistakes:</strong>${c.mistakes}</div>
                    <div class="detail-item"><strong>🔍 سورس‌کد خوانی:</strong>${c.source}</div>
                </div>
                <div class="brief-box"><strong>📋 سفارش و خواسته کارفرما:</strong> ${c.brief}</div>
            </div>
        `;
    });
    updateProgress();
}

function toggle(id) {
    const state = JSON.parse(localStorage.getItem("go_30_progress") || "{}");
    state[id] = !state[id];
    localStorage.setItem("go_30_progress", JSON.stringify(state));
    updateProgress();
}

function updateProgress() {
    const state = JSON.parse(localStorage.getItem("go_30_progress") || "{}");
    const completed = Object.values(state).filter(Boolean).length;
    const total = chapters.length;
    const percent = Math.round((completed / total) * 100);
    document.getElementById("progress-text").innerText = `${percent}٪ (${completed} از ${total})`;
    document.getElementById("progress-fill").style.width = `${percent}%`;
}

document.addEventListener("DOMContentLoaded", render);
</script>
</body>
</html>
